# 댓글 → DM 자료 발송. 5분마다 새 댓글을 확인한다 (GitHub 사정으로 몇 분 늦을 수 있음).
name: comment-dm
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: comment-dm
  cancel-in-progress: false
jobs:
  dm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node dm.mjs
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          DM_CAMPAIGNS: dm-campaigns.json
